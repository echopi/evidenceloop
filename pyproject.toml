[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "evidenceloop"
version = "0.1.0"
description = "Evidence-driven investigation ledger for crash analysis"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.9"
authors = [{ name = "EvidenceLoop contributors" }]
maintainers = [{ name = "EvidenceLoop contributors" }]
keywords = ["crash", "debugging", "investigation", "evidence", "ledger", "cli"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Debuggers",
]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=7", "pytest-cov>=5", "ruff>=0.5"]
release = ["build>=1", "twine>=5"]

[project.urls]
Homepage = "https://github.com/echopi/evidenceloop"
Repository = "https://github.com/echopi/evidenceloop"
Issues = "https://github.com/echopi/evidenceloop/issues"
Changelog = "https://github.com/echopi/evidenceloop/blob/main/CHANGELOG.md"

[project.scripts]
eloop = "evidenceloop.cli:main"
evidenceloop = "evidenceloop.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/evidenceloop"]

[tool.hatch.build.targets.sdist]
include = [
    "src/evidenceloop",
    "tests",
    "examples",
    "README.md",
    "LICENSE",
    "CHANGELOG.md",
    "CONTRIBUTING.md",
]

[tool.ruff]
line-length = 100
target-version = "py39"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
pythonpath = ["src"]

[tool.coverage.run]
source = ["evidenceloop"]

[tool.coverage.report]
show_missing = true
